services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: serviciosalud-jenkins:lts
    container_name: serviciosalud-jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
